[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "econflow"
version = "0.1.0"
description = "EconFlow -- Reusable panel econometrics research platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Abrha Megos Meressa", email = "abrhamgs3@gmail.com" }]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "statsmodels>=0.14",
    "linearmodels>=5.3",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyarrow>=12.0",
]
app = [
    "streamlit>=1.35",
]

[project.scripts]
econflow = "econflow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/econflow"]
exclude = [
    "src/econflow/cli_scaffold",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --import-mode=importlib"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/econflow"]
omit = [
    # Development scaffold (not shipped in wheel)
    "src/econflow/cli_scaffold/*",
    # NOT uniformly dead code. estimation/, diagnostics/, and outputs/ contain
    # live, tested, load-bearing functionality (the PooledOLS/EntityFE/TwoWayFE
    # estimators; the diagnostics plugin registry; the renderer engine behind
    # 'econflow report') alongside a substantial NotImplementedError stub
    # surface -- omitted so stub code doesn't dilute the coverage percentage,
    # not because the package is unused. features/, ml/, processing/, and most
    # of core/, data/, econometrics/, reporting/, sensitivity/ are largely or
    # entirely unreferenced outside themselves. See
    # docs/development/TECHNICAL_DEBT.md for the per-file breakdown.
    "src/econflow/core/*",
    "src/econflow/data/*",
    "src/econflow/diagnostics/*",
    "src/econflow/estimation/*",
    "src/econflow/econometrics/*",
    "src/econflow/features/*",
    "src/econflow/ml/*",
    "src/econflow/processing/*",
    "src/econflow/reporting/*",
    "src/econflow/sensitivity/*",
    "src/econflow/outputs/*",
    # Legacy stub ingestion adapters (csv_loader is live)
    "src/econflow/ingestion/base.py",
    "src/econflow/ingestion/cache.py",
    "src/econflow/ingestion/world_bank.py",
    "src/econflow/ingestion/oecd.py",
    "src/econflow/ingestion/pwt.py",
    # Legacy pipeline (superseded by pipeline_generic.py)
    "src/econflow/pipeline.py",
    # Logger stub
    "src/econflow/logging.py",
]

[tool.coverage.report]
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py310"
exclude = [
    "src/econflow/cli_scaffold",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "F401", "I001"]

[project.urls]
Repository = "https://github.com/abrhamgs3/econflow"
Changelog  = "https://github.com/abrhamgs3/econflow/blob/main/CHANGELOG.md"