# EconFlow Blind Replication Example
# Firm investment panel — 6 firms, 1990–2004
#
# This project is the canonical example for the EconFlow Replication Engine.
# It demonstrates that econflow reproduce can reproduce published results
# from only the project directory, configuration, and data.
#
# True data-generating process (for reference only — not used in estimation):
#   invest = 1.8 * market_value + 0.6 * capital_stock + firm_FE + ε

project:
  name: "blind_replication_example"
  description: "Firm investment panel — blind replication demonstration"
  version: "1.0.0"
  authors:
    - name: "EconFlow Team"

data:
  path: "../data/investment_panel.csv"
  entity_col: "firm"
  time_col: "year"
  required_columns:
    - firm
    - year
    - invest
    - market_value
    - capital_stock

sample:
  start_year: 1990
  end_year: 2004

variables:
  dependent: "invest"
  regressors:
    - "market_value"
    - "capital_stock"
